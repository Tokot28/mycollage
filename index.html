<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коллаж</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #111;
      font-family: sans-serif;
    }
    h1 {
      color: #fff;
      text-align: center;
      font-size: 20px;
    }
    .collage {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }
    .collage img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      transition: transform .2s;
    }
    /* Подсветка кликабельного фото */
    .collage a img {
      border: 3px solid #ffcc00;
      cursor: pointer;
    }
    .collage a img:hover {
      transform: scale(1.03);
    }
    .hint {
      color: #ffcc00;
      text-align: center;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Наш коллаж</h1>

  <div class="collage">
    <!-- Это фото — гиперссылка на вторую страницу -->
    <a href="page2.html">
      <img src="images/photo1.jpg" alt="Нажми на меня">
    </a>

    <img src="images/photo2.jpg" alt="Фото 2">
    <img src="images/photo3.jpg" alt="Фото 3">
    <img src="images/photo4.jpg" alt="Фото 4">
  </div>

  <p class="hint">👆 Нажмите на фото с жёлтой рамкой</p>
</body>
</html>
