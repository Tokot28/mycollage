
 
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коллаж</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #F19CBB;
      font-family: sans-serif;
    }
    h1 {
      color: #fff;
      text-align: center;
      font-size: 20px;
    }
    .collage {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }
    .collage img {
      width: 90%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      transition: transform .2s;
     } 
       img {
    max-width: 95%;
    transition: transform .3s;
    cursor: pointer;
  }
  img:active {
    transform: scale(1.5);
  }
    
    /* Кликабельное фото с жёлтой рамкой */
    .collage a img {
      border: 2px solid #ff0033;
      cursor: pointer;
    }
    .collage a img:hover {
      transform: scale(1.05);
    }
    .hint {
      color: #ffcc00;
      text-align: center;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>Коллаж тепла и уюта </h1>

  <div class="collage">
    
    <img src="Images/photo1.jpg" alt="Фото 1">
    <img src="Images/Images/photo_2026-10-16_15-30-04.jpg" alt="Фото 4">
    <img src="Images/photo3.jpg" alt="Фото 3">
    <img src="Images/photo6.jpg" alt="Фото 6">
    <img src="Images/photo5.jpg" alt="Фото 5">
    <img src="Images/photo7.jpg" alt="Фото 7">
    <img src="Images/photo9.jpg" alt="Фото 9">
    <img src="Images/photo8.jpg" alt="Фото 8">
    

    <!-- Это фото — гиперссылка на вторую страницу -->
    <a href="page2.html">
      <img src="Images/photo10.jpg" alt="Нажми на меня">
    </a>
  </div>

  
</body>
</html>
